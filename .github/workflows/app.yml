name: App (Windows + Mac)

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "index.html"
      - "settings.js"
      - "products.json"
      - "img/**"
      - "fonts/**"
      - "tools/**"
      - ".github/workflows/app.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Put the pages inside the app (also checks products.json)
        run: node tools/build-dist.mjs app/dist

      - name: Build the app and the setup file
        working-directory: app
        run: npx --yes @tauri-apps/cli@2 build --bundles nsis

      - name: Rename setup file
        shell: pwsh
        run: |
          $exe = Get-ChildItem app/src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item $exe.FullName out/Reference-Setup.exe
          Write-Host "Setup: $($exe.Name)  $([math]::Round($exe.Length/1MB,2)) MB"

      - name: Test like a customer (silent install, start, stays open, uninstall)
        shell: pwsh
        run: |
          Start-Process out/Reference-Setup.exe -ArgumentList "/S" -Wait
          $app = Get-ChildItem "$env:LOCALAPPDATA\Reference" -Recurse -Filter *.exe | Where-Object { $_.Name -notmatch "uninstall" } | Select-Object -First 1
          if (-not $app) { Write-Error "App was not installed"; exit 1 }
          Write-Host "Installed: $($app.FullName)"
          $p = Start-Process $app.FullName -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { Write-Error "App closed by itself (exit code $($p.ExitCode))"; exit 1 }
          Write-Host "App is running OK"
          Stop-Process -Id $p.Id -Force
          $un = Get-ChildItem "$env:LOCALAPPDATA\Reference" -Filter uninstall.exe | Select-Object -First 1
          if ($un) { Start-Process $un.FullName -ArgumentList "/S" -Wait; Write-Host "Uninstall OK" }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/Reference-Setup.exe

  mac:
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Put the pages inside the app (also checks products.json)
        run: node tools/build-dist.mjs app/dist

      - name: Build the app (one file for Intel and Apple Silicon Macs)
        working-directory: app
        run: npx --yes @tauri-apps/cli@2 build --target universal-apple-darwin --bundles dmg

      - name: Rename installer
        run: |
          mkdir -p out
          cp app/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg out/Reference-Mac.dmg
          ls -lh out

      - name: Test like a customer (open dmg, copy app, start, stays open)
        run: |
          hdiutil attach out/Reference-Mac.dmg -nobrowse -mountpoint /tmp/refdmg
          cp -R /tmp/refdmg/Reference.app /tmp/Reference.app
          hdiutil detach /tmp/refdmg
          lipo -info /tmp/Reference.app/Contents/MacOS/*
          /tmp/Reference.app/Contents/MacOS/* &
          PID=$!
          sleep 8
          if ! kill -0 $PID 2>/dev/null; then echo "App closed by itself"; exit 1; fi
          echo "App is running OK"
          kill $PID

      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: out/Reference-Mac.dmg

  release:
    needs: [windows, mac]
    if: ${{ always() && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Read version
        id: v
        run: echo "version=$(node -p "require('./app/src-tauri/tauri.conf.json').version")" >> $GITHUB_OUTPUT
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ steps.v.outputs.version }}
          name: Reference App ${{ steps.v.outputs.version }}
          make_latest: true
          fail_on_unmatched_files: false
          files: |
            out/Reference-Setup.exe
            out/Reference-Mac.dmg
          body: |
            برنامه‌ی Reference برای ویندوز و مک. بدون اینترنت هم کار می‌کند.

            ویندوز:
            ۱. فایل Reference-Setup.exe را دانلود کن.
            ۲. روی آن دوبار کلیک کن. تمام.

            مک:
            ۱. فایل Reference-Mac.dmg را دانلود کن و باز کن.
            ۲. Reference را داخل پوشه‌ی Applications بکش.
            ۳. بار اول: روی Reference راست‌کلیک کن و Open را بزن.
               اگر باز نشد: System Settings → Privacy & Security → پایین صفحه، Open Anyway.
